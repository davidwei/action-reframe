<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Video parts</title>
<style>
:root{color-scheme:dark;font:16px system-ui;background:#10151c;color:#e5edf5}body{max-width:1800px;margin:24px auto;padding:0 20px}h1{font-size:27px;margin-bottom:5px}h2{font-size:20px;margin:0}.muted,p{color:#acbbc8}a{color:#85d4f8}button{font:inherit;padding:9px 14px;color:inherit;background:#28576b;border:1px solid #527083;border-radius:6px;cursor:pointer}button:disabled{opacity:.45;cursor:wait}.toolbar,.actions{display:flex;align-items:center;flex-wrap:wrap;gap:11px}.toolbar{margin:16px 0 22px}.part{background:#18232e;border:1px solid #344858;border-radius:11px;margin:20px 0;padding:16px}.part.tracked{border-left:5px solid #5dff9d}.part.untracked{border-left:5px solid #718291}.head{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:12px}.badge{border-radius:999px;padding:4px 9px;font-size:13px;background:#304050}.tracked .badge{color:#8dffb6;background:#183e2b}.labels{display:grid;grid-template-columns:1fr 1fr;text-align:center;background:#101820;padding:8px;font-weight:650}.stage{background:#030507;border:1px solid #405363;border-radius:8px;overflow:hidden}video{display:block;width:100%;background:#000;max-height:72vh}.time{font-variant-numeric:tabular-nums}.save-status{font-size:14px;color:#b9c9d5}.error{color:#ffb494}.empty{padding:30px;background:#18232e;border-radius:10px}.hidden{display:none}
</style>
<p><a href="/library">← Folder library</a> · <a id="tracking">Object tracking</a> · <a id="comparison">Full processed view</a></p>
<h1 id="title">Video parts</h1>
<p>Parts are split whenever saved target geometry starts or stops guiding the rendered crop. Preview the synchronized original and processed views, then save the useful processed intervals.</p>
<div class="toolbar"><label><input id="trackedOnly" type="checkbox"> Show tracked parts only</label><button id="reload">Refresh</button><span id="summary" class="muted">Loading…</span></div>
<main id="parts"></main>
<p id="status" role="status" class="muted"></p>
<script src="/files/lookout.js?v=1"></script>
<script>
const $=id=>document.getElementById(id),project=new URLSearchParams(location.search).get('config')||'';
let state=null,activeVideo=null,pollTimer=null;
const format=seconds=>{seconds=Math.max(0,Number(seconds)||0);const h=Math.floor(seconds/3600),m=Math.floor(seconds%3600/60),s=seconds%60;return (h?String(h)+':':'')+String(m).padStart(h?2:1,'0')+':'+s.toFixed(3).padStart(6,'0')};
function element(tag,text,className){const node=document.createElement(tag);if(text!=null)node.textContent=text;if(className)node.className=className;return node}
function sourceSummary(part){return Object.entries(part.sources||{}).map(([key,value])=>`${key}: ${value}`).join(' · ')||'No source recorded'}
function stopOther(video){if(activeVideo&&activeVideo!==video){activeVideo.pause();activeVideo.removeAttribute('src');activeVideo.load();const old=activeVideo.closest('.part');if(old)old.querySelector('.play').textContent='Play'}activeVideo=video}
function attachVideo(card,part){const video=card.querySelector('video'),play=card.querySelector('.play'),pause=card.querySelector('.pause');
 const ready=()=>new Promise((resolve,reject)=>{if(video.readyState>=1)return resolve();video.addEventListener('loadedmetadata',resolve,{once:true});video.addEventListener('error',()=>reject(Error('The comparison video could not be loaded.')),{once:true})});
 const seek=seconds=>new Promise(resolve=>{if(Math.abs(video.currentTime-seconds)<.04)return resolve();video.addEventListener('seeked',resolve,{once:true});video.currentTime=seconds});
 play.onclick=async()=>{stopOther(video);play.disabled=true;try{if(!video.src){video.src='/files/'+state.comparison+'?v='+state.comparison_version;video.load()}await ready();if(video.currentTime<part.start_seconds-.04||video.currentTime>=part.end_seconds-.02)await seek(part.start_seconds);await video.play();play.textContent='Playing…'}catch(error){$('status').textContent=error.message}finally{play.disabled=false}};
 pause.onclick=()=>video.pause();video.onpause=()=>{play.textContent='Play'};video.onended=()=>{play.textContent='Play'};
 video.ontimeupdate=()=>{if(video.currentTime>=part.end_seconds-.01){video.pause();video.currentTime=part.start_seconds}};
 video.onseeking=()=>{if(video.currentTime<part.start_seconds-.05)video.currentTime=part.start_seconds;else if(video.currentTime>part.end_seconds+.05)video.currentTime=Math.max(part.start_seconds,part.end_seconds-.04)};
}
async function save(part,button,status){button.disabled=true;status.textContent='Queueing export…';try{const response=await fetch('/api/parts/save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({config:project,part:part.index})});const result=await response.json();if(!response.ok)throw Error(result.error||response.status);status.textContent='Export queued…';schedulePoll()}catch(error){status.textContent=error.message;status.classList.add('error');button.disabled=false}}
function showSave(card,part){const button=card.querySelector('.save'),status=card.querySelector('.save-status');status.replaceChildren();status.classList.toggle('error',part.save_status==='failed');button.disabled=false;button.textContent=part.save_status==='done'?'Save again':'Save processed part';
 if(part.save_status==='queued'||part.save_status==='running'){button.disabled=true;status.textContent=part.save_status==='running'?`Saving… ${Math.round((part.save_progress||0)*100)}%`:'Waiting to save…'}
 else if(part.save_status==='done'){const link=element('a',`Open ${part.filename}`);link.href='/files/'+part.output;link.download=part.filename;status.append(link)}
 else if(part.save_status==='failed')status.textContent='Save failed: '+(part.save_error||'unknown error');
}
function render(){const root=$('parts'),trackedOnly=$('trackedOnly').checked;root.replaceChildren();let shown=0;
 for(const part of state.parts){if(trackedOnly&&!part.tracked)continue;shown++;const card=element('article',null,'part '+(part.tracked?'tracked':'untracked'));card.dataset.part=part.index;
  const head=element('div',null,'head'),heading=element('div');heading.append(element('h2',`Part ${part.index}`),element('div',`${format(part.start_seconds)} – ${format(part.end_seconds)} · ${format(part.duration_seconds)} · ${part.frames.toLocaleString()} frames`,'muted time'));head.append(heading,element('span',part.tracked?'Tracked':'Untracked','badge'));card.append(head);
  card.append(element('p',part.tracked?'Saved target geometry guides zoom and crop throughout this interval.':'No saved target geometry guides zoom and crop in this interval.'));
  card.append(element('p',sourceSummary(part),'muted'));
  const stage=element('div',null,'stage'),labels=element('div',null,'labels');labels.append(element('span','Original'),element('span','Processed'));const video=document.createElement('video');video.preload='none';video.playsInline=true;stage.append(labels,video);card.append(stage);
  const actions=element('div',null,'actions'),play=element('button','Play','play'),pause=element('button','Pause','pause'),saveButton=element('button','Save processed part','save'),saveStatus=element('span','', 'save-status');
  saveButton.onclick=()=>save(part,saveButton,saveStatus);actions.append(play,pause,saveButton,saveStatus);card.append(actions);root.append(card);showSave(card,part);attachVideo(card,part);
 }
 if(!shown)root.append(element('p','No parts match this filter.','empty'));$('summary').textContent=`${state.parts.filter(p=>p.tracked).length} tracked · ${state.parts.filter(p=>!p.tracked).length} untracked · ${state.parts.length} total`;
}
function schedulePoll(){clearTimeout(pollTimer);pollTimer=setTimeout(()=>load(true),2000)}
async function load(statusOnly=false){try{const response=await fetch('/api/parts?config='+encodeURIComponent(project));const value=await response.json();if(!response.ok)throw Error(value.error||response.status);state=value;$('title').textContent=(value.project_name||'Video')+' · parts';if(statusOnly){for(const part of value.parts){const card=document.querySelector(`.part[data-part="${part.index}"]`);if(card)showSave(card,part)}}else render();if(value.parts.some(p=>p.save_status==='queued'||p.save_status==='running'))schedulePoll();else clearTimeout(pollTimer);$('status').textContent=''}catch(error){$('status').textContent=error.message;$('status').classList.add('error')}}
$('tracking').href='/?config='+encodeURIComponent(project);$('comparison').href='/compare?config='+encodeURIComponent(project);$('trackedOnly').onchange=render;$('reload').onclick=load;load();
</script></html>
